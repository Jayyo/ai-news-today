name: Build edition

# Manual for now. To build and commit an edition every morning, uncomment the
# schedule and add an OPENAI_API_KEY repository secret (without the secret the
# build falls back to feed leads and no model is called). Deploying public/ is a
# separate step.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "KST date (YYYY-MM-DD). Empty means yesterday."
        required: false
  # schedule:
  #   - cron: "30 22 * * *"  # 07:30 KST

permissions:
  contents: write

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDITION_DATE: ${{ inputs.date }}
        run: |
          args=(--keep-existing)
          if [ -n "$EDITION_DATE" ]; then args+=(--date "$EDITION_DATE"); fi
          if [ -z "$OPENAI_API_KEY" ]; then args+=(--no-model); fi
          python -m digest build "${args[@]}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editions public
          if git diff --cached --quiet; then exit 0; fi
          day=$(git diff --cached --name-only -- editions | sed -n 's#^editions/\(.*\)\.json$#\1#p' | head -1)
          git commit -m "Add edition ${day:-update}"
          git push
